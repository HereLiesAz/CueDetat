# Cue d'État — Gradle version catalog.
#
# Every version here is a VERIFIED LATEST STABLE release (checked against
# repo1.maven.org / dl.google.com maven-metadata.xml, not from memory).
# Pre-release coordinates (-RC / -alpha / -beta) are not permitted: the previous
# catalog pinned Kotlin 2.4.20-RC, an unreleased compiler, as the project baseline.
#
# Toolchain: JDK 21 everywhere (see gradle.properties + jvmToolchain(21)).

[versions]
applicationId = "com.hereliesaz.cuedetat"
appName = "Cue D’état"

# ── Toolchain ────────────────────────────────────────────────────────────────
jdk = "21"
kotlin = "2.4.10"
agp = "9.3.2"
ksp = "2.3.11"
composeMultiplatform = "1.11.1"

# ── Kotlin ecosystem (multiplatform-capable) ─────────────────────────────────
coroutines = "1.11.0"
serialization = "1.11.0"
atomicfu = "0.33.0"

# ── AndroidX / Jetpack ───────────────────────────────────────────────────────
activityCompose = "1.13.0"
androidxCore = "1.19.0"
appcompat = "1.7.1"
camerax = "1.6.1"
composeUi = "1.12.0"
datastore = "1.2.1"
lifecycle = "2.11.0"
material = "1.14.0"
material3 = "1.4.0"
material3AdaptiveNavSuite = "1.4.0"
materialIconsExtended = "1.7.8"
palette = "1.0.0"

# ── Dependency injection (Android layer only; the KMP core is pure) ──────────
hilt = "2.60.1"
hiltNavigationCompose = "1.3.0"

# ── Vision / AR (Android-only) ───────────────────────────────────────────────
arcore = "1.54.0"
mlkitObjectDetection = "17.0.2"
mlkitVisionCommon = "17.3.0"
opencv = "4.13.0"
tensorflowLite = "2.17.0"
tensorflowLiteSupport = "0.5.0"
tensorflowLiteMetadata = "0.5.0"

# ── Play / distribution (play flavor only) ───────────────────────────────────
billing = "9.1.0"
playFeatureDelivery = "2.1.0"
playIntegrity = "1.6.0"
playServicesLocation = "21.3.0"
playServicesWearable = "18.2.0"

# ── Wearables (play flavor only — see app/build.gradle.kts) ──────────────────
metaWearableDat = "0.6.0"

# ── Networking ───────────────────────────────────────────────────────────────
retrofit = "3.0.0"

# ── UI third-party ───────────────────────────────────────────────────────────
aznavrail = "11.21"

# ── Test ─────────────────────────────────────────────────────────────────────
junit = "4.13.2"
androidxJunit = "1.3.0"
espresso = "3.7.0"

# ── Transitive pins (CVE remediation) ────────────────────────────────────────
bouncycastle = "1.84"
guava = "33.6.0-android"
netty = "4.1.137.Final"

[libraries]

# ── Kotlin multiplatform core ────────────────────────────────────────────────
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-guava = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-guava", version.ref = "coroutines" }
kotlinx-coroutines-play-services = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-play-services", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-atomicfu = { module = "org.jetbrains.kotlinx:atomicfu", version.ref = "atomicfu" }

# ── AndroidX ─────────────────────────────────────────────────────────────────
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-appcompat = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidxCore" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-palette = { module = "androidx.palette:palette-ktx", version.ref = "palette" }

# ── Compose (Android) ────────────────────────────────────────────────────────
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "composeUi" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-compose-material3-adaptive-navigation-suite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite", version.ref = "material3AdaptiveNavSuite" }
androidx-compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended", version.ref = "materialIconsExtended" }
androidx-compose-ui = { module = "androidx.compose.ui:ui", version.ref = "composeUi" }
androidx-compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "composeUi" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "composeUi" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "composeUi" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "composeUi" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "composeUi" }
material = { module = "com.google.android.material:material", version.ref = "material" }

# ── CameraX ──────────────────────────────────────────────────────────────────
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# ── Hilt ─────────────────────────────────────────────────────────────────────
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "hiltNavigationCompose" }

# ── Vision / AR ──────────────────────────────────────────────────────────────
arcore = { module = "com.google.ar:core", version.ref = "arcore" }
mlkit-detection = { module = "com.google.mlkit:object-detection", version.ref = "mlkitObjectDetection" }
mlkit-vision-common = { module = "com.google.mlkit:vision-common", version.ref = "mlkitVisionCommon" }
opencv = { module = "org.opencv:opencv", version.ref = "opencv" }
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflowLite" }
tensorflow-lite-gpu = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tensorflowLite" }
tensorflow-lite-gpu-api = { module = "org.tensorflow:tensorflow-lite-gpu-api", version.ref = "tensorflowLite" }
tensorflow-lite-support = { module = "org.tensorflow:tensorflow-lite-support", version.ref = "tensorflowLiteSupport" }
tensorflow-lite-metadata = { module = "org.tensorflow:tensorflow-lite-metadata", version.ref = "tensorflowLiteMetadata" }

# ── Play / distribution ──────────────────────────────────────────────────────
androidx-billing-ktx = { module = "com.android.billingclient:billing-ktx", version.ref = "billing" }
play-feature-delivery = { module = "com.google.android.play:feature-delivery", version.ref = "playFeatureDelivery" }
play-integrity = { module = "com.google.android.play:integrity", version.ref = "playIntegrity" }
play-services-location = { module = "com.google.android.gms:play-services-location", version.ref = "playServicesLocation" }
play-services-wearable = { module = "com.google.android.gms:play-services-wearable", version.ref = "playServicesWearable" }

# ── Meta Wearables DAT (private GitHub Packages — play flavor only) ──────────
mwdat-core = { module = "com.meta.wearable:mwdat-core", version.ref = "metaWearableDat" }
mwdat-camera = { module = "com.meta.wearable:mwdat-camera", version.ref = "metaWearableDat" }
mwdat-mockdevice = { module = "com.meta.wearable:mwdat-mockdevice", version.ref = "metaWearableDat" }

# ── Networking ───────────────────────────────────────────────────────────────
retrofit = { module = "com.squareup.retrofit2:retrofit", version.ref = "retrofit" }
retrofit-converter-gson = { module = "com.squareup.retrofit2:converter-gson", version.ref = "retrofit" }

# ── UI third-party ───────────────────────────────────────────────────────────
aznavrail = { module = "com.github.HereLiesAz.AzNavRail:aznavrail", version.ref = "aznavrail" }

# ── Test ─────────────────────────────────────────────────────────────────────
junit = { module = "junit:junit", version.ref = "junit" }
androidx-junit = { module = "androidx.test.ext:junit", version.ref = "androidxJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

# ── Transitive CVE pins ──────────────────────────────────────────────────────
bouncycastle-bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-bcutil = { module = "org.bouncycastle:bcutil-jdk18on", version.ref = "bouncycastle" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
android-dynamic-feature = { id = "com.android.dynamic-feature", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
hilt-android = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }

[bundles]
camera = ["androidx-camera-core", "androidx-camera-camera2", "androidx-camera-lifecycle", "androidx-camera-view"]
compose-android = [
    "androidx-compose-ui",
    "androidx-compose-ui-graphics",
    "androidx-compose-ui-tooling-preview",
    "androidx-compose-foundation",
    "androidx-compose-material3",
    "androidx-activity-compose",
]
