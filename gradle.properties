# Project-wide Gradle settings.
# IDE settings configured through Android Studio will override this file.

# ── Daemon ───────────────────────────────────────────────────────────────────
org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# ── Kotlin ───────────────────────────────────────────────────────────────────
kotlin.code.style=official
kotlin.daemon.useFallbackStrategy=false
# JDK 21 toolchain across every module (also declared via jvmToolchain(21)).
kotlin.compiler.jvmTarget=21
# Kotlin Multiplatform: silence the source-set-layout warning and opt into the
# hierarchical metadata the :core:* modules rely on for their shared targets.
kotlin.mpp.applyDefaultHierarchyTemplate=true
kotlin.mpp.stability.nowarn=true
kotlin.native.ignoreDisabledTargets=true

# ── Android ──────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.nonTransitiveRClass=true
android.r8.strictFullModeForKeepRules=false
android.r8.optimizedResourceShrinking=true
android.onlyEnableUnitTestForTheTestedBuildType=false
android.uniquePackageNames=false
android.dependency.useConstraints=true
# Required so the play-flavor source set can register a Provider-backed
# generated assets dir. Task ordering is wired explicitly via dependsOn.
android.sourceset.disallowProvider=false
