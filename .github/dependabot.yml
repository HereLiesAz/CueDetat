# Dependabot version updates. Security advisories are separate (repository settings).
version: 2
updates:
  # Gradle: the version catalog and every module's build files.
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "weekly"
  # The workflows' pinned actions.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
  # The capture relay's (dependency-free) package manifest and tests.
  - package-ecosystem: "npm"
    directory: "/ml/capture-relay"
    schedule:
      interval: "monthly"
