name: Compile and Release APK

# Manually triggered signed release APK build.
# Auto-detects app name from settings.gradle.kts / settings.gradle.
# Reads version from version.properties (Major.Minor.Patch.Build).
#
# Required secrets:
#   KEYSTORE_RAW        — base64-encoded release keystore (.jks)
#   KEYSTORE_PASSWORD   — keystore password
#   KEY_ALIAS           — key alias inside the keystore
#   KEY_PASSWORD        — key password
#
# Optional secrets (Google Services injection — skipped if template absent):
#   GOOGLE_SERVICES_API_KEY
#   PROJECT_ID
#   CLIENT_ID
#
# Optional secrets (add any extra project-specific API keys here):
#   CUSTOM_API_KEY      — placeholder; rename and replicate as needed

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Inject Google Services
        env:
          GOOGLE_SERVICES_API_KEY: ${{ secrets.GOOGLE_SERVICES_API_KEY }}
          PROJECT_ID: ${{ secrets.PROJECT_ID }}
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CUSTOM_API_KEY: ${{ secrets.CUSTOM_API_KEY }}
        run: |
          if [ -f "app/google-services.json.template" ]; then
            echo "Template found. Injecting secrets..."
            sed -e 's/{{\([^}]*\)}}/${\1}/g' app/google-services.json.template | envsubst > app/google-services.json
          else
            echo "Warning: google-services.json.template not found. Skipping injection."
          fi
          # Add any extra local.properties keys below:
          # echo "CUSTOM_API_KEY=$CUSTOM_API_KEY" >> local.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_RAW: ${{ secrets.KEYSTORE_RAW }}
        run: |
          if [ -z "$KEYSTORE_RAW" ]; then
            echo "::error::KEYSTORE_RAW secret is empty — cannot produce a signed build."
            exit 1
          fi
          echo "$KEYSTORE_RAW" | base64 -d > app/keystore.jks
          if [ ! -s app/keystore.jks ]; then
            echo "::error::Decoded keystore is empty — KEYSTORE_RAW is not valid base64."
            exit 1
          fi
          echo "Keystore decoded to app/keystore.jks ($(stat -c%s app/keystore.jks) bytes)"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
        with:
          cache-read-only: false
          dependency-graph: disabled

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KEYSTORE_FILE: ${{ github.workspace }}/app/keystore.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Prepare Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MAJOR=$(grep '^versionMajor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          MINOR=$(grep '^versionMinor=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          PATCH=$(grep '^versionPatch=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          BUILD_NUMBER=$(grep '^versionBuild=' version.properties | cut -d'=' -f2 | tr -d '\r ')
          VERSION_NAME="${MAJOR}.${MINOR}.${PATCH}.${BUILD_NUMBER}"
          TAG_NAME="latest-release-v${MAJOR}.${MINOR}"

          if [ -f "settings.gradle.kts" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle.kts | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          elif [ -f "settings.gradle" ]; then
            APP_NAME=$(grep 'rootProject.name' settings.gradle | sed -E "s/.*=.*[\"'](.*)[\"']/\1/")
          else
            APP_NAME="App"
          fi

          APK_ORIGINAL=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -z "$APK_ORIGINAL" ]; then
            echo "Error: No APK found in app/build/outputs/apk/release/"
            find app/build/outputs/ -name "*.apk"
            exit 1
          fi

          TARGET_NAME="${APP_NAME}-${VERSION_NAME}-release.apk"
          mv "$APK_ORIGINAL" "$TARGET_NAME"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -fa "$TAG_NAME" -m "Latest Release Build"
          git push origin "$TAG_NAME" --force

          if gh release view "$TAG_NAME" > /dev/null 2>&1; then
            echo "Updating existing release..."
            gh release edit "$TAG_NAME" \
              --title "Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})" \
              --notes "Release build from commit $GITHUB_SHA"
            gh release upload "$TAG_NAME" "$TARGET_NAME" --clobber
          else
            echo "Creating new release..."
            gh release create "$TAG_NAME" "$TARGET_NAME" \
              --title "Latest Release v${MAJOR}.${MINOR} (${VERSION_NAME})" \
              --notes "Release build from commit $GITHUB_SHA"
          fi
