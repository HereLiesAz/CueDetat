name: Jules Issue Handler

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      title:
        description: 'Issue Title'
        required: true
        type: string
      body:
        description: 'Issue Body'
        required: true
        type: string

jobs:
  handle_issue:
    # The issue text goes straight into an autonomous agent's prompt, and anyone can open an issue
    # on a public repo: only the owner's side (owner, members, collaborators) or a manual dispatch
    # may drive it. A stranger's issue otherwise steers an agent that opens pull requests.
    if: |
      github.event_name == 'workflow_dispatch' ||
      contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Invoke Jules
        # SUPPLY CHAIN: unpinned. This action runs with repository secrets in
        # scope, and @main means whatever its author pushes next runs here with
        # no review. Pin to a release tag or a commit SHA. Left unpinned only
        # because the pinning SHA could not be resolved offline -- do not treat
        # this comment as the fix.
        uses: google-labs-code/jules-invoke@main
        with:
          jules_api_key: ${{ secrets.JULES_API_KEY }}
          prompt: |
            You are an expert software engineer and security agent named Jules.
            You have been assigned to handle the following issue:

            Title: ${{ github.event.issue.title || github.event.inputs.title }}

            Body:
            ${{ github.event.issue.body || github.event.inputs.body }}

            Your goal is to resolve this issue efficiently and correctly.
            - If this is a bug report, analyze the codebase, reproduce the issue if possible, and fix it.
            - If this is a feature request, implement the requested feature.
            - If this is a security issue, prioritize it, analyze the vulnerability, and implement a fix.
            - If this is a question, provide a helpful and accurate answer.

            IMPORTANT:
            When you have completed the task, you MUST ensure the issue is closed.
            - If you create a Pull Request to fix the issue, include "Fixes #${{ github.event.issue.number || '0' }}" in the Pull Request description so that the issue is automatically closed when the PR is merged.
            - If no code change is required (e.g., answering a question), you should close the issue yourself or instruct on how to close it.
