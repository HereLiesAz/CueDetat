# centralized-by: HereLiesAz/workflows
# central-source-path: .github/workflows/play_publish.yml
# central-source-sha256: c99c3eed02d6deb557eaba891c904d3fcdabde1c27a518dee8c7e8e422b92b98
# This file intentionally contains no repository secrets.
# central-run-tracker: HereLiesAz/workflows
name: Play Publish (AAB)
on:
  push:
    branches: 'main'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build the .aab but do NOT publish it to Play'
        type: boolean
        default: false
        required: true

permissions: {}
jobs:
  central:
    name: Hand-off
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Point to central result
        env:
          STATUS_CONTEXT: .github/workflows/play_publish.yml
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: "set -euo pipefail\n# The build runs in HereLiesAz/workflows. Its result is reported on this commit as the\n# commit status named below: pending when the central run starts, then success or\n# failure. This job only points there and ends, so it never holds a runner while the\n# central run waits for one. (Trackers that followed the central run job-by-job held a\n# runner each for the whole build; under the account's concurrent-job limit they\n# starved the very runs they were waiting on: 2026-10-01, illumera waited 3h to start.)\n# No status at all means the gateway intentionally skipped this event.\n{\n  echo \"### Runs in HereLiesAz/workflows\"\n  echo\n  echo \"Result: commit status \\`$STATUS_CONTEXT\\` on \\`$TARGET_SHA\\`.\"\n  echo \"Central runs: $GITHUB_SERVER_URL/HereLiesAz/workflows/actions\"\n} >> \"$GITHUB_STEP_SUMMARY\"\necho \"Result is reported as commit status '$STATUS_CONTEXT' on $TARGET_SHA.\"\n"
